[package]
name = "bigJson"
version = "0.1.2"
description = "Desktop viewer for huge JSON files"
authors = ["Malay Mishra"]
edition = "2021"

[lib]
name = "bigJson_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
simd-json = "0.13"
serde_json_path = "0.7"
parking_lot = "0.12"
thiserror = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
