name: release

# Triggers on tag push like v0.1.0 — builds bigJson on macOS, Linux, and
# Windows runners and uploads the bundles as assets on a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt into the Node.js 24 runtime for js-based actions to silence the
  # node-20 deprecation warning (default flip happens June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # One job creates a draft release first so matrix builds below upload
  # to the same release_id instead of racing to createRelease (which throws
  # `already_exists` on the second-place runner).
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: ensure release exists
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              return data.id;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const body = [
              '## Downloads',
              '',
              '- **macOS** (Intel + Apple Silicon): `bigJson_*_universal.dmg`',
              '- **Windows**: `bigJson_*_x64-setup.exe`',
              '- **Linux**: `bigJson_*_amd64.AppImage` or `.deb`',
              '',
              'All builds are **unsigned** — on first launch your OS may warn:',
              '- macOS: right-click the app → Open, or `xattr -cr /Applications/bigJson.app`',
              '- Windows: SmartScreen → "More info" → "Run anyway"',
              '- Linux AppImage: `chmod +x bigJson_*.AppImage && ./bigJson_*.AppImage`',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `bigJson ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary on macOS so a single .dmg runs on Intel + Apple Silicon.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin
          # Use older Ubuntu for broad glibc compatibility — newer builds
          # often fail to launch on slightly older distros.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: sync version from tag
        shell: bash
        run: node scripts/sync-version.mjs "${GITHUB_REF_NAME}"

      - name: install rust + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Flip the draft → published once every platform finished uploading.
  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: false,
            });
